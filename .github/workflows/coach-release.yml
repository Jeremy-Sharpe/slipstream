name: Coach installers

on:
  workflow_dispatch:
  push:
    tags:
      - "coach-v*"

permissions:
  contents: read

concurrency:
  group: coach-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: ubuntu-latest
            artifact: slipstream-coach-linux
          - label: macOS
            runner: macos-latest
            artifact: slipstream-coach-macos
          - label: Windows
            runner: windows-latest
            artifact: slipstream-coach-windows

    defaults:
      run:
        working-directory: coach

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coach/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run coach tests
        run: npm test

      - name: Build unsigned installers
        run: npm run make
        env:
          CI: "true"

      - name: Upload installers
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: coach/out/make/**/*
          if-no-files-found: error
          retention-days: 14
