name: Coach installers

on:
  workflow_dispatch:
  push:
    tags:
      - "coach-v*"

permissions:
  contents: read

concurrency:
  group: coach-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # The coach captures system audio through macOS loopback capture, so macOS is the only
    # supported installer. Signing and notarisation stay unconfigured by design.
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: coach

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coach/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run coach tests
        run: npm test

      - name: Build unsigned DMG
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: slipstream-coach-macos-${{ github.sha }}
          path: coach/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
